media:
  input: public/media
  output: /my-portfolio-2026/media

content:
  - name: posts
    label: ブログ記事
    type: collection
    path: src/content/blog
    extension: md
    format: yaml-frontmatter
    filename:
      template: "{fields.id}.md"
      field: create
    fields:
      - name: id
        type: uuid
        label: ID
        options:
          editable: false
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 紹介文
        type: text
        required: true
      - name: pubDate
        label: 公開日時
        type: date
        required: true
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: updatedDate
        label: 更新日時
        type: date
        default: ''
        options:
          time: true
          format: "yyyy-MM-dd'T'HH:mm:ssXXX"
      - name: tags
        label: タグ
        type: string
        list: true
      - name: draft
        label: 下書き
        type: boolean
        default: true
      - name: body
        label: 本文
        type: rich-text
        options:
          format: markdown
