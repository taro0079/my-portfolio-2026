media:
  input: public/media
  output: /my-portfolio-2026/media

content:
  - name: posts
    label: ブログ記事
    type: collection
    path: src/content/blog
    format: yaml-frontmatter
    filename: '{primary}.md'
    fields:
      - name: title
        label: タイトル
        type: string
        required: true
      - name: description
        label: 紹介文
        type: text
        required: true
      - name: pubDate
        label: 公開日
        type: date
        required: true
        options:
          format: yyyy-MM-dd
      - name: updatedDate
        label: 更新日
        type: date
        default: ''
        options:
          format: yyyy-MM-dd
      - name: tags
        label: タグ
        type: string
        list: true
      - name: draft
        label: 下書き
        type: boolean
        default: true
      - name: body
        label: 本文
        type: rich-text
        options:
          format: markdown
